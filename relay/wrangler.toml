name = "arris-listen"
main = "src/index.mjs"
compatibility_date = "2026-01-01"

# 免费计划只能用 SQLite 后端的 Durable Object（官方文档明确）
[[durable_objects.bindings]]
name = "ROOM"
class_name = "Room"

[[durable_objects.bindings]]
name = "DIRECTORY"
class_name = "Directory"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

# v2：新增房间目录（v1 已部署，新增类必须走新 tag，不能改历史迁移）
[[migrations]]
tag = "v2"
new_sqlite_classes = ["Directory"]
